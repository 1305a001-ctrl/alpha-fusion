services:
  alpha-fusion:
    image: ghcr.io/1305a001-ctrl/alpha-fusion:latest
    container_name: alpha-fusion
    restart: unless-stopped
    env_file:
      - /srv/secrets/alpha-fusion.env
    ports:
      - "127.0.0.1:8007:8007"
    networks:
      - infra-net

networks:
  infra-net:
    external: true
