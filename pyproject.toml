[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "alpha-fusion"
version = "0.3.0"
description = "Phase 2.6 — bridges news-consolidator's signals:trading/critical/poly streams to alphas:active. v0.1 is 1:1 Signal→Alpha passthrough with asset canonicalization and per-strategy lookup."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "structlog>=24.1",
    "pydantic-settings>=2.3",
    "aiohttp>=3.9",
    "signals-contract @ https://github.com/1305a001-ctrl/signals-contract/archive/refs/tags/v0.2.0.tar.gz",
]

[project.scripts]
alpha-fusion = "alpha_fusion.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
